name: Release tooling

# Validates the release pipeline WITHOUT credentials: script tests, shellcheck and actionlint.
# Builds and publishes nothing (that is release-mac.yml).
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/mac/release/**"
      - "apps/mac/Package.swift"
      - "apps/mac/Resources/Info.plist"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "apps/mac/release/**"
      - "apps/mac/Package.swift"
      - "apps/mac/Resources/Info.plist"

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PyYAML (workflow structure checks)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Release script tests
        run: python3 -m unittest discover -s apps/mac/release/tests -v

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR -s bash apps/mac/release/*.sh

      - name: actionlint (pinned version and checksum)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 --output "$dir/al.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $dir/al.tar.gz" | sha256sum -c -
          tar -xzf "$dir/al.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" .github/workflows/*.yml
