name: Release Mac

# Builds "Bixku Utilities.app", signs it with Developer ID, notarizes and staples it, and publishes:
#   - BixkuUtilities-<version>.dmg  drag-to-Applications disk image (signed, notarized, stapled)  -> GitHub Release
#   - BixkuUtilities-<version>.zip  the app (ditto -c -k --keepParent; signed, notarized, stapled) -> GitHub Release
#                                   and Sparkle feed in Cloudflare R2 (EdDSA-signed, generate_appcast)
# Full guide, exact list of secrets/variables and rollback: docs/release.md
#
#   git tag -a v1.2.3 -m "..." && git push origin v1.2.3     # real release (v1.2.3-beta.1 -> beta channel)
#   Actions -> Release Mac -> Run workflow                     # dry-run by default, no credentials needed
#
# Security:
#  - Triggered only by tags or by hand; there is NO pull_request/pull_request_target (forks never see secrets).
#  - A real release requires a vX.Y.Z tag reachable from RELEASE_BRANCH (main).
#  - Repository-level secrets and variables, so the `preflight` job can list every missing one and fail first,
#    before touching keychains, network or credentials. Preflight only receives an "exists / does not exist" flag
#    per secret; each secret's value is only passed to the steps that use it. The `publish` job uses the
#    `release` environment as an optional manual approval gate.
#  - Every REAL release is signed with Developer ID and notarized; there is no unsigned channel.
#  - DRY-RUN (workflow_dispatch with dry_run=true, the default): no credentials required. Ad-hoc signature, no
#    notarization or stapling, unsigned DMG. If the R2 credentials exist it uploads ONLY under
#    <UPDATES_BASE_URL>/test/<run_id>/ (and checks the production feed was not touched); otherwise it uploads
#    nothing and attaches the generated test appcast as an artifact. Without the Sparkle key, the test app and
#    its test feed use a throw-away key generated in the build job. Never creates tags or GitHub Releases.
#  - Actions pinned by commit SHA (comment = version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: ad-hoc signature, no notarization; uploads only under test/<run_id>/ (or nothing) and creates no release. Untick only when running from a vX.Y.Z tag"
        type: boolean
        default: true
      draft_release:
        description: "Create the GitHub Release as a draft"
        type: boolean
        default: false
      min_macos_version:
        description: "Declared minimum macOS (LSMinimumSystemVersion and sparkle:minimumSystemVersion)"
        type: string
        default: "13.0"

permissions:
  contents: read

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

# Pipeline defaults (no secrets). Edited here; they are not GitHub variables.
env:
  MIN_MACOS_VERSION: ${{ inputs.min_macos_version || '13.0' }}
  RELEASE_BRANCH: main # branch the tag must belong to
  UNIVERSAL: "1" # arm64 + x86_64 (0 = host architecture only)
  SPARKLE_AUTO_UPDATE: "false" # SUAutomaticallyUpdate
  SPARKLE_CHECK_INTERVAL: "86400" # SUScheduledCheckInterval (seconds, >= 3600)
  MAX_DELTAS: "3"
  MAX_VERSIONS: "5" # versions kept in the feed (zips are never deleted)
  DELTA_COMPRESSION: lzma
  PHASED_ROLLOUT_INTERVAL: "" # seconds between phased rollout groups (stable channel only); empty = none
  FULL_RELEASE_NOTES_URL: ""
  XCODE_VERSION: "" # empty = runner default; e.g. 16.4 selects /Applications/Xcode_16.4.app

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      r2_ready: ${{ steps.check.outputs.r2_ready || 'true' }}
      sparkle_key_ready: ${{ steps.check.outputs.sparkle_key_ready || 'true' }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.short_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mode (real release or dry-run)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then dry=false; else dry="$DRY_INPUT"; fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "Mode: dry_run=$dry"

      # FIRST check: lists ALL missing secrets/vars (names only). Secrets arrive as a flag (`set` or empty):
      # this job never receives their values.
      - name: Required secrets and variables
        id: check
        env:
          PREFLIGHT_MODE: ${{ steps.mode.outputs.dry_run == 'true' && 'dryrun' || 'release' }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && 'set' || '' }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD != '' && 'set' || '' }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD != '' && 'set' || '' }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' && 'set' || '' }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' && 'set' || '' }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID != '' && 'set' || '' }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' && 'set' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'set' || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'set' || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
        run: bash apps/mac/release/preflight.sh release

      # Ancestry, not equality: an older commit of the branch may be tagged, but not an unreviewed branch.
      - name: The tag must be on the release branch
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/${RELEASE_BRANCH}: releases come from that branch."
            exit 1
          fi

      - name: Version, channel and build number
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$DRY_RUN" = "true" ]; then flag=(--dry-run); fi
          bash apps/mac/release/version.sh --ref-type "$REF_TYPE" --ref-name "$REF_NAME" ${flag[@]+"${flag[@]}"}

  build:
    name: Build, sign and notarize
    needs: preflight
    # Pinned runner (not *-latest): release builds must be reproducible across runs
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
      VERSION: ${{ needs.preflight.outputs.version }}
      # Dry-run without the repository Sparkle key: a throw-away key pair signs the test app and its test feed
      SPARKLE_EPHEMERAL: ${{ (needs.preflight.outputs.dry_run == 'true' && needs.preflight.outputs.sparkle_key_ready != 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paths
        run: |
          echo "APP_PATH=$RUNNER_TEMP/out/Bixku Utilities.app" >> "$GITHUB_ENV"
          echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -n "${XCODE_VERSION:-}" ]; then
            dir="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ ! -d "$dir" ]; then echo "::error::Xcode ${XCODE_VERSION} is not installed on the runner (looked for /Applications/Xcode_<version>.app)"; exit 1; fi
            sudo xcode-select -s "$dir/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Temporary keychain with the Developer ID certificate
        if: env.DRY_RUN != 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash apps/mac/release/keychain.sh setup

      # generate_appcast only signs updates for apps that carry SUPublicEDKey, so the test app needs a key too.
      # It protects nothing (test build, test feed) and is handed to `publish` as a 1-day artifact.
      - name: Ephemeral Sparkle key (dry-run without the repository key)
        if: env.SPARKLE_EPHEMERAL == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ephemeral-sparkle"
          mkdir -p "$dir"
          ( umask 077; python3 -I apps/mac/release/appcast.py gen-key > "$dir/keypair" )
          echo "::add-mask::$(sed -n 1p "$dir/keypair")"
          echo "EPHEMERAL_SPARKLE_PUBLIC_KEY=$(sed -n 2p "$dir/keypair")" >> "$GITHUB_ENV"

      - name: Hand the ephemeral key to the publish job
        if: env.SPARKLE_EPHEMERAL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ephemeral-sparkle-key-${{ github.run_id }}
          path: ${{ runner.temp }}/ephemeral-sparkle/keypair
          if-no-files-found: error
          retention-days: 1

      - name: Assemble the app (with Sparkle)
        env:
          SHORT_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
          RELEASE_MODE: ${{ env.DRY_RUN == 'true' && 'dryrun' || 'release' }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'online.bixku.utilities' }}
          # In a dry-run the app points at the TEST feed (test/<run_id>), never at production
          UPDATES_BASE_URL: ${{ env.DRY_RUN == 'true' && format('{0}/test/{1}', vars.UPDATES_BASE_URL || 'https://updates.example.invalid/bixku-utilities', github.run_id) || vars.UPDATES_BASE_URL }}
          SPARKLE_ED_PUBLIC_KEY: ${{ env.SPARKLE_EPHEMERAL == 'true' && env.EPHEMERAL_SPARKLE_PUBLIC_KEY || vars.SPARKLE_ED_PUBLIC_KEY }}
        run: APP_OUT="$APP_PATH" bash apps/mac/release/assemble-app.sh

      - name: Sign (hardened runtime, inside-out)
        env:
          # Dry-run: no certificate, ad-hoc ("-"). Release: SIGN_IDENTITY (hash) was exported by keychain.sh.
          SIGN_IDENTITY: ${{ env.DRY_RUN == 'true' && '-' || env.SIGN_IDENTITY }}
          RELEASE_MODE: ${{ env.DRY_RUN == 'true' && 'dryrun' || 'release' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash apps/mac/release/sign-app.sh "$APP_PATH"

      - name: Notarize and staple the app
        if: env.DRY_RUN != 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash apps/mac/release/notarize.sh "$APP_PATH"

      # The FINAL zip is created AFTER stapling (Sparkle and the GitHub Release use it)
      - name: Final zip and checksum
        env:
          REQUIRE_STAPLE: ${{ env.DRY_RUN == 'true' && '0' || '1' }}
        run: bash apps/mac/release/package.sh "$APP_PATH" "$DIST/BixkuUtilities-${VERSION}.zip"

      - name: Disk image (drag to Applications)
        env:
          SIGN_IDENTITY: ${{ env.DRY_RUN == 'true' && '-' || env.SIGN_IDENTITY }}
          RELEASE_MODE: ${{ env.DRY_RUN == 'true' && 'dryrun' || 'release' }}
        run: bash apps/mac/release/dmg.sh "$APP_PATH" "$DIST/BixkuUtilities-${VERSION}.dmg"

      - name: Notarize and staple the disk image
        if: env.DRY_RUN != 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash apps/mac/release/notarize.sh "$DIST/BixkuUtilities-${VERSION}.dmg"

      - name: Disk image checksum (after stapling)
        run: |
          set -euo pipefail
          cd "$DIST"
          shasum -a 256 "BixkuUtilities-${VERSION}.dmg" > "BixkuUtilities-${VERSION}.dmg.sha256"
          cat ./*.sha256

      - name: Upload the build as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bixku-utilities-mac-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.DRY_RUN == 'true' && 3 || 30 }}

      # Always, whether the job failed or not: delete keychain and temporary credentials
      - name: Clean up keychain and credentials
        if: always()
        run: bash apps/mac/release/keychain.sh cleanup

  publish:
    name: Publish (Sparkle feed in R2 + GitHub Release)
    needs: [preflight, build]
    runs-on: macos-15
    timeout-minutes: 45
    # Optional manual approval (Settings -> Environments -> release -> Required reviewers). No secrets of its own.
    environment: release
    permissions:
      contents: write # create the GitHub Release (real releases only)
    # One publisher at a time (shared with rollback-mac): two releases never race on the appcast
    concurrency:
      group: mac-updates-feed
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      # Dry-run: everything under <UPDATES_BASE_URL>/test/<run_id> with the R2_TEST_ONLY guard (r2.sh refuses to
      # write elsewhere), or offline (R2_OFFLINE=1) when the R2 credentials are not configured.
      R2_TEST_ONLY: ${{ needs.preflight.outputs.dry_run == 'true' && '1' || '0' }}
      R2_OFFLINE: ${{ (needs.preflight.outputs.dry_run == 'true' && needs.preflight.outputs.r2_ready != 'true') && '1' || '0' }}
      SPARKLE_EPHEMERAL: ${{ (needs.preflight.outputs.dry_run == 'true' && needs.preflight.outputs.sparkle_key_ready != 'true') && 'true' || 'false' }}
      UPDATES_BASE_URL: ${{ needs.preflight.outputs.dry_run == 'true' && format('{0}/test/{1}', vars.UPDATES_BASE_URL || 'https://updates.example.invalid/bixku-utilities', github.run_id) || vars.UPDATES_BASE_URL }}
    steps:
      - name: Paths
        run: echo "DL=$RUNNER_TEMP/dl" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true # notes: annotated tag message and previous tag
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bixku-utilities-mac-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/dl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SPARKLE_EPHEMERAL == 'true'
        with:
          name: ephemeral-sparkle-key-${{ github.run_id }}
          path: ${{ runner.temp }}/ephemeral-sparkle

      # Real release: without Developer ID signature + notarization the workflow ABORTS here.
      - name: Check the downloaded artifacts (checksums, signatures, tickets)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd "$DL"
          shasum -a 256 -c "BixkuUtilities-${VERSION}.zip.sha256"
          shasum -a 256 -c "BixkuUtilities-${VERSION}.dmg.sha256"
          hdiutil verify -quiet "BixkuUtilities-${VERSION}.dmg"
          check="$(mktemp -d)"
          ditto -x -k "BixkuUtilities-${VERSION}.zip" "$check"
          app="$check/Bixku Utilities.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$DRY_RUN" != "true" ]; then
            if ! codesign -d --verbose=2 "$app" 2>&1 | grep -x "TeamIdentifier=${APPLE_TEAM_ID}" >/dev/null; then
              echo "::error::the app is not signed with the Developer ID of APPLE_TEAM_ID: an unsigned release is never published"
              exit 1
            fi
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app" 2>&1 | sed 's/^origin=.*/origin=<hidden>/'
            codesign --verify --strict --verbose=2 "BixkuUtilities-${VERSION}.dmg"
            xcrun stapler validate "BixkuUtilities-${VERSION}.dmg"
            spctl --assess --type open --context context:primary-signature -vv "BixkuUtilities-${VERSION}.dmg" 2>&1 | sed 's/^origin=.*/origin=<hidden>/'
          fi
          rm -rf "$check"

      - name: Install the Sparkle tools (pinned version and checksum)
        run: bash apps/mac/release/sparkle-tools.sh install "$RUNNER_TEMP/sparkle"

      - name: Ensure the aws CLI (preinstalled on GitHub macOS runners)
        if: env.R2_OFFLINE != '1'
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then brew install awscli; fi
          aws --version

      - name: Fingerprint of the production appcast (before)
        if: env.DRY_RUN == 'true' && env.R2_OFFLINE != '1'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash apps/mac/release/r2.sh prod-snapshot "$RUNNER_TEMP/prod-appcast.before"

      - name: Publish (zips, deltas and notes first; appcast last)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SPARKLE_ED_KEYPAIR_FILE: ${{ env.SPARKLE_EPHEMERAL == 'true' && format('{0}/ephemeral-sparkle/keypair', runner.temp) || '' }}
          NOTES_MD_OUT: ${{ runner.temp }}/release-notes.md
          APPCAST_OUT: ${{ runner.temp }}/test-feed
        run: bash apps/mac/release/publish.sh "$DL/BixkuUtilities-${VERSION}.zip"

      - name: Check the test objects and that production was not touched
        if: env.DRY_RUN == 'true' && env.R2_OFFLINE != '1'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          bash apps/mac/release/r2.sh ls | tee "$RUNNER_TEMP/test-objects.txt"
          grep -q "test/${GITHUB_RUN_ID}/appcast.xml" "$RUNNER_TEMP/test-objects.txt"
          grep -q "test/${GITHUB_RUN_ID}/releases/BixkuUtilities-${VERSION}.zip" "$RUNNER_TEMP/test-objects.txt"
          bash apps/mac/release/r2.sh prod-assert-unchanged "$RUNNER_TEMP/prod-appcast.before"

      - name: Attach the test feed (offline dry-run)
        if: env.R2_OFFLINE == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bixku-utilities-test-feed-${{ github.run_id }}
          path: ${{ runner.temp }}/test-feed/
          if-no-files-found: error
          retention-days: 3

      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft_release }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=("$DL/BixkuUtilities-${VERSION}.dmg" "$DL/BixkuUtilities-${VERSION}.dmg.sha256"
                 "$DL/BixkuUtilities-${VERSION}.zip" "$DL/BixkuUtilities-${VERSION}.zip.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            if [ "${DRAFT:-false}" = "true" ]; then flags+=(--draft); fi
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Bixku Utilities ${VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" ${flags[@]+"${flags[@]}"}
          fi

      # Always: the Sparkle key only exists as a 0600 temp file inside appcast.sh; remove it if anything left it
      - name: Delete temporary keys
        if: always()
        run: rm -rf "$RUNNER_TEMP"/bixku-sparkle-key-* "$RUNNER_TEMP"/bixku-notary-* "$RUNNER_TEMP/ephemeral-sparkle"
