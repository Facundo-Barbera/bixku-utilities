name: Rollback Mac

# Removes ONE version from the Sparkle feed without touching the others. That version's files (zip and deltas)
# are moved to retired/ in the bucket (never deleted: reversible, and the deltas of other versions do not depend
# on them). Users who ALREADY installed the removed version do not go back: Sparkle only moves forward; for them,
# publish a fixed release with a higher version. Guide: docs/release.md ("Rollback").
#
# Dry-run by default: regenerates and validates the feed without publishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to remove, without the v (e.g. 1.2.3 or 1.3.0-beta.2)"
        required: true
        type: string
      dry_run:
        description: "Dry-run: regenerate and validate the feed, do not publish"
        type: boolean
        default: true
      keep_files:
        description: "Do not move the zip and deltas to retired/ (only remove the version from the feed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rollback-mac
  cancel-in-progress: false

env:
  MIN_MACOS_VERSION: "13.0"
  RELEASE_BRANCH: main # the only branch the rollback runs from
  MAX_DELTAS: "3"
  MAX_VERSIONS: "5"
  DELTA_COMPRESSION: lzma

jobs:
  guard:
    name: Preflight (branch and secrets/vars)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::The rollback runs the scripts of the selected ref: start it from ${RELEASE_BRANCH} (current ref: ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before touching network or credentials: list EVERYTHING missing (names only). Secrets arrive as a flag.
      - name: Required secrets and variables
        env:
          PREFLIGHT_MODE: release
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' && 'set' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'set' || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'set' || '' }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
        run: bash apps/mac/release/preflight.sh rollback

  rollback:
    name: Remove the version from the feed
    needs: guard
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    # Same group as publishing: a release and a rollback never write the appcast at the same time
    concurrency:
      group: mac-updates-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Sparkle tools (pinned version and checksum)
        run: bash apps/mac/release/sparkle-tools.sh install "$RUNNER_TEMP/sparkle"

      - name: Ensure the aws CLI (preinstalled on GitHub macOS runners)
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then brew install awscli; fi
          aws --version

      - name: Rollback
        env:
          VERSION_TO_RETIRE: ${{ inputs.version }}
          ROLLBACK_DRY_RUN: ${{ inputs.dry_run }}
          KEEP_FILES: ${{ inputs.keep_files }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: bash apps/mac/release/rollback.sh "$VERSION_TO_RETIRE"

      - name: Delete temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP"/bixku-sparkle-key-*
