# gitleaks configuration: default rules plus project-specific rules that guard
# against leaking personal data. Patterns use bracket tricks (e.g. "[e]") so
# this file does not match its own rules.
title = "Bixku Utilities gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "personal-internal-hostname"
description = "Internal host names must not appear in the repository"
regex = '''(?i)(conta[b]o|mini-fbarber[a])'''
tags = ["personal"]

[[rules]]
id = "private-or-tailnet-ip"
description = "Private, tailnet or CGNAT IPv4 addresses"
regex = '''(?:^|[^0-9.])(?:10\.[0-9]{1,3}|192\.168|172\.(?:1[6-9]|2[0-9]|3[01])|10[0]\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}(?:[^0-9]|$)'''
tags = ["personal"]

[[rules]]
id = "linux-home-path"
description = "Absolute Linux user home paths"
regex = '''/hom[e]/([A-Za-z_][A-Za-z0-9._-]*)'''
secretGroup = 1
tags = ["personal"]

[[rules]]
id = "macos-user-path"
description = "Absolute macOS user home paths"
regex = '''/User[s]/([A-Za-z0-9._-]+)'''
secretGroup = 1
tags = ["personal"]

[[rules]]
id = "personal-email"
description = "Personal e-mail addresses (use the GitHub noreply address instead)"
regex = '''[A-Za-z0-9._%+-]+@(?:gmai[l]|hotmai[l]|outloo[k]|icloud|yahoo)\.'''
tags = ["personal"]

[[rules]]
id = "hardcoded-password"
description = "Hard-coded password assignment"
regex = '''(?i)(?:password|passwd)\s*=\s*(?:"[^"]{6,}"|'[^']{6,}'|[A-Za-z0-9!#%^&*_+.\-]{6,})'''
tags = ["secret"]

[allowlist]
description = "Build output and dependency folders"
paths = [
  '''(^|/)\.build/''',
  '''(^|/)DerivedData/''',
  '''(^|/)\.git/''',
]
